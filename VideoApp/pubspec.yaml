name: video_app
description: A TikTok/Instagram-style short video app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # Video
  video_player: ^2.8.3
  image_picker: ^1.0.7

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
